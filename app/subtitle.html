<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file:; media-src 'none'; style-src 'self'; script-src 'self'; connect-src 'none'"><title>Kairos · 桌面气泡</title><link rel="stylesheet" href="subtitle.css"></head><body><section class="desktop-chat"><div class="toolbar"><span>KAIROS</span><button id="expression-toggle" aria-expanded="false" aria-controls="expression-wheel">切换表情</button><button id="accessory-toggle">饰品</button><button id="character-toggle">角色</button><button id="summarize" title="总结并保存记忆，会消耗 API 额度">总结记忆</button><button id="settings">设置</button><button id="close" title="收起气泡">×</button></div><div id="bubbles" aria-live="polite" aria-label="最近三条消息"></div><div id="notice" role="status"></div><form id="composer"><textarea id="input" rows="2" maxlength="10000" placeholder="和 Kairos 说点什么…" aria-label="消息"></textarea><button id="cancel" type="button" hidden>停止</button><button id="send" type="submit">发送</button></form><small class="hint">Enter 发送 · Shift + Enter 换行</small><section id="expression-wheel" role="dialog" aria-label="选择表情，Normal 恢复自动" aria-modal="true" hidden><div class="wheel-header"><span>选择后保持 · Normal 恢复自动</span><button id="wheel-close" aria-label="关闭表情轮盘">×</button></div><div id="wheel-options"></div></section><section id="accessory-panel" class="aux-panel" role="dialog" aria-label="切换饰品" hidden><div class="wheel-header"><span>饰品 · 可组合佩戴</span><button id="accessory-close" aria-label="关闭饰品">×</button></div><div id="accessory-options"></div><p>点击佩戴 / 取下。佩戴时显示一条随机台词，不调用 API。</p></section></section><script src="subtitle.js"></script></body></html>
