<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'"><title>Desktop-company · 陪伴控制</title><link rel="stylesheet" href="companion.css"></head><body><main><h1>陪伴模式</h1><p>手动开启后，识别当前软件类型；绘画软件中可检测连续 Ctrl+Z。不读取截图、网页、窗口标题或输入内容，不连接 API。</p><div id="status" role="status">陪伴已关闭</div><div id="budget"></div><div class="buttons"><button id="start">开启陪伴</button><button id="stop" class="stop" disabled>关闭陪伴 · 停止识别</button></div><div class="buttons"><button id="roast" disabled>吐槽一下</button><button id="oops" disabled>我又翻车了</button></div><p class="hint">不点按钮时，每十分钟尝试说一次。不因切换窗口调用 AI。游戏死亡无法自动识别；“我又翻车了”由你主动告诉他。</p><blockquote id="last">还没有陪伴吐槽。</blockquote><form id="prefs"><label>每日吐槽次数上限（手动、定时和撤回反馈共用）<input id="dailyLimit" type="number" min="1" max="100" value="30" required></label><label>共用冷却（秒）<input id="cooldown" type="number" min="30" max="600" value="60" required></label><label class="check"><input id="undoEnabled" type="checkbox" checked>绘画软件中，8 秒内至少 4 次 Ctrl+Z 时反馈</label><label class="check"><input id="gameMode" type="checkbox">将无法识别的软件按游戏陪伴（浏览器等已识别类型保持原分类）</label><details><summary>编辑固定台词 · 每行一条，可含 1～3 句</summary><div id="line-editors"></div><p>空分类会恢复默认台词。这里的台词完全本地随机，不会通过人设或 AI 改写。</p></details><button type="submit">保存陪伴设置</button></form><p class="hint">每次重新打开程序默认关闭。收起此控制窗口会继续陪伴；真正停止请点上方“关闭陪伴”，或托盘菜单中的“关闭陪伴”。猫猫模式及切换角色时自动停止。屏幕锁定、系统限制或部分游戏可能导致识别不到。</p><div id="notice" role="status"></div></main><script src="companion.js"></script></body></html>
